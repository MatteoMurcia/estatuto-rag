name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: estatuto
          POSTGRES_PASSWORD: estatuto
          POSTGRES_DB: estatuto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estatuto -d estatuto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://estatuto:estatuto@localhost:5432/estatuto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Tests
        run: uv run pytest --cov=estatuto_rag --cov-report=term-missing

  evals:
    # Gate de calidad: con los embeddings bge-m3 precalculados (sin Ollama ni GPU), el PR
    # falla si el hit@5 del híbrido baja del umbral. Primeros resultados: 0.85 (28/33).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: estatuto
          POSTGRES_PASSWORD: estatuto
          POSTGRES_DB: estatuto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estatuto -d estatuto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://estatuto:estatuto@localhost:5432/estatuto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Gate de recuperación (hit@5 del híbrido >= 0.80)
        run: uv run python -m estatuto_rag.evals --solo-cache --min-hit5 0.80
      - name: Tabla en el resumen del job
        if: always()
        run: cat results/recuperacion.md >> "$GITHUB_STEP_SUMMARY" || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
