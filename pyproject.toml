[project]
name = "estatuto-rag"
version = "0.1.0"
description = "RAG sobre el Estatuto de los Trabajadores con búsqueda híbrida, citas por artículo y evaluación en CI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estatuto_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: orden de imports, B: bugbear,
# UP: sintaxis moderna, SIM: simplificaciones, RUF: reglas propias de ruff
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: necesita Postgres en marcha (docker compose up -d db)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
